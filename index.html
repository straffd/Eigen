<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 3v18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M5 4h14M6 8h12"/><rect x="4" y="12" width="16" height="8" rx="2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
    <symbol id="i-square-plus" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-circle-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" aria-label="Sidebar">
      <header class="sidebar-header">
        <a class="logo" href="#" aria-label="Eigen home">Eigen<span class="lambda">λ</span></a>
        <button class="icon-btn" id="collapse" type="button" aria-label="Close sidebar">
          <svg class="lg"><use href="#i-panel"/></svg>
        </button>
      </header>

      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input type="search" placeholder="Search" aria-label="Search">
        <kbd>/</kbd>
      </label>

      <nav class="nav">
        <a class="row" href="#"><svg><use href="#i-archive"/></svg>Archive</a>
        <a class="row" href="#"><svg><use href="#i-calendar"/></svg>Calendar</a>
        <a class="row" href="#"><svg><use href="#i-clock"/></svg>Timetable</a>
      </nav>

      <nav class="nav">
        <a class="row muted" href="#"><svg><use href="#i-briefcase"/></svg>Customize</a>
        <a class="row muted" href="#"><svg><use href="#i-briefcase"/></svg>Customize</a>
        <a class="row muted" href="#"><svg><use href="#i-briefcase"/></svg>Customize</a>
      </nav>

      <section class="classes">
        <div class="section-header">
          <span>Classes</span>
          <button class="icon-btn" type="button" aria-label="Add class"><svg><use href="#i-square-plus"/></svg></button>
        </div>
        <ul class="class-list">
          <li class="class-item">
            <button class="row class-toggle" type="button" aria-expanded="false">
              <svg class="chev"><use href="#i-chevron"/></svg><span>XXXX</span>
            </button>
            <div class="class-actions">
              <button class="icon-btn" type="button" aria-label="Class settings"><svg class="sm"><use href="#i-settings"/></svg></button>
              <button class="icon-btn" type="button" aria-label="Add to class"><svg class="sm"><use href="#i-circle-plus"/></svg></button>
            </div>
          </li>
          <li class="class-item">
            <button class="row class-toggle" type="button" aria-expanded="false">
              <svg class="chev"><use href="#i-chevron"/></svg><span>XXXX</span>
            </button>
            <div class="class-actions">
              <button class="icon-btn" type="button" aria-label="Class settings"><svg class="sm"><use href="#i-settings"/></svg></button>
              <button class="icon-btn" type="button" aria-label="Add to class"><svg class="sm"><use href="#i-circle-plus"/></svg></button>
            </div>
          </li>
          <li class="class-item">
            <button class="row class-toggle" type="button" aria-expanded="false">
              <svg class="chev"><use href="#i-chevron"/></svg><span>XXXX</span>
            </button>
            <div class="class-actions">
              <button class="icon-btn" type="button" aria-label="Class settings"><svg class="sm"><use href="#i-settings"/></svg></button>
              <button class="icon-btn" type="button" aria-label="Add to class"><svg class="sm"><use href="#i-circle-plus"/></svg></button>
            </div>
          </li>
        </ul>
      </section>
    </aside>

    <main class="main">
      <button class="icon-btn reopen" id="reopen" type="button" aria-label="Open sidebar">
        <svg class="lg"><use href="#i-panel"/></svg>
      </button>

      <div class="home">
        <h1 class="greeting" id="greeting">Good evening</h1>
        <p class="subtitle">Everything for today, in one place.</p>

        <form class="ask" onsubmit="return false">
          <textarea rows="1" placeholder="Ask about your classes, notes or due dates…" aria-label="Ask Eigen"></textarea>
          <div class="ask-bar">
            <button class="icon-btn" type="button" aria-label="Attach file"><svg><use href="#i-paperclip"/></svg></button>
            <button class="send" type="submit" aria-label="Send"><svg><use href="#i-arrow-up"/></svg></button>
          </div>
        </form>

        <div class="cards">
          <a class="card" href="#">
            <div class="card-head"><svg><use href="#i-calendar"/></svg>Due soon</div>
            <p class="card-empty">Nothing due yet</p>
          </a>
          <a class="card" href="#">
            <div class="card-head"><svg><use href="#i-clock"/></svg>Today</div>
            <p class="card-empty">No classes scheduled</p>
          </a>
          <a class="card" href="#">
            <div class="card-head"><svg><use href="#i-file"/></svg>Recent files</div>
            <p class="card-empty">No files opened</p>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script>
    const app = document.getElementById('app');
    const toggle = () => app.classList.toggle('collapsed');
    document.getElementById('collapse').addEventListener('click', toggle);
    document.getElementById('reopen').addEventListener('click', toggle);

    document.querySelectorAll('.class-toggle').forEach(btn =>
      btn.addEventListener('click', () =>
        btn.setAttribute('aria-expanded', btn.getAttribute('aria-expanded') !== 'true')));

    const h = new Date().getHours();
    document.getElementById('greeting').textContent =
      h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';

    const search = document.querySelector('.search input');
    document.addEventListener('keydown', e => {
      if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
        e.preventDefault(); search.focus();
      }
    });

    const ta = document.querySelector('.ask textarea');
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  </script>
</body>
</html>
