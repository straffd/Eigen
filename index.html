<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com">

        </button>
      </header>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="Search" aria-label="Search">
      </label>

      <nav class="nav">
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24"><path d="M5 4h14M6 8h12"/><rect x="4" y="12" width="16" height="8" rx="2"/></svg>
          Archive
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Calendar
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Timetable
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
          Customize
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
          Customize
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
          Customize
        </a>
      </nav>

      <section class="classes">

          </button>
        </div>

          <li class="class-item">
            <button class="class-toggle" type="button" aria-expanded="false">
              <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>

            <button class="icon-btn tiny" type="button" aria-label="Add to class"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
          </li>
          <li class="class-item">
            <button class="class-toggle" type="button" aria-expanded="false">
              <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
              <span>XXXX</span>
            </button>
            <button class="icon-btn tiny" type="button" aria-label="Class settings"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button class="icon-btn tiny" type="button" aria-label="Add to class"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
          </li>
          <li class="class-item">
            <button class="class-toggle" type="button" aria-expanded="false">
              <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
              <span>XXXX</span>
            </button>
            <button class="icon-btn tiny" type="button" aria-label="Class settings"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button class="icon-btn tiny" type="button" aria-label="Add to class"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
          </li>
        </ul>
      </section>
    </aside>

    <main class="main">
      <button class="icon-btn reopen" id="reopen" type="button" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 3v18"/></svg>
      </button>
    </main>
  </div>

  <script>
    const app = document.getElementById('app');
    const toggle = () => app.classList.toggle('collapsed');
    document.getElementById('collapse').addEventListener('click', toggle);
    document.getElementById('reopen').addEventListener('click', toggle);
    document.querySelectorAll('.class-toggle').forEach(btn =>
      btn.addEventListener('click', () =>
        btn.setAttribute('aria-expanded', btn.getAttribute('aria-expanded') !== 'true')));
  </script>
</body>
</html>
